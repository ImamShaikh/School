{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School Admin Portal</title>
  <link rel="stylesheet" href="{% static 'css/admin-style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="login-bg">
  <div class="login-card">
    <img src="{% static 'Image/Govind Ashramshala logo.png' %}" alt="Logo" class="login-logo">
    <h2>Admin Portal</h2>
    <p>Sign in to manage the school portfolio</p>
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert-admin alert-admin-error" style="margin-bottom: 1.5rem; text-align: left; font-size: 0.9rem;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    
    <form action="{% url 'Appadmin:login' %}" method="post">
      {% csrf_token %}
      <div class="form-group-admin" style="text-align: left;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control-admin" placeholder="Enter username" required>
      </div>
      <div class="form-group-admin" style="text-align: left;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control-admin" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; justify-content: center; margin-top: 1rem; padding-block: 0.75rem;">
        Sign In
      </button>
    </form>
    
    <div style="margin-top: 2rem; font-size: 0.85rem; color: var(--admin-text-muted);">
      <a href="{% url 'school:home' %}" style="text-decoration: none; color: var(--admin-accent); font-weight: 500;">
        <i class="fas fa-arrow-left"></i> Back to school website
      </a>
    </div>
  </div>
</body>
</html>
